<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rufaid Mahmud | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #38bdf8;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            min-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 50px 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero span {
            color: #0284c7;
        }

        .hero p {
            font-size: 20px;
            color: #555;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .skills {
            padding: 50px 8%;
            background: white;
            text-align: center;
        }

        .skills h2 {
            margin-bottom: 25px;
        }

        .skill {
            display: inline-block;
            padding: 12px 20px;
            margin: 6px;
            background: #e0f2fe;
            border-radius: 6px;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #111827;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h2>Rufaid Mahmud</h2>

    <nav>
        <a href="#home">Home</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero" id="home">
    <div>
        <h1>Hello, I'm <span>Rufaid</span> 👋</h1>

        <p>Network Engineer | Cloud & DevOps Enthusiast</p>

        <a href="#contact" class="btn">Contact Me</a>
    </div>
</section>

<section class="skills" id="skills">
    <h2>My Skills</h2>

    <div class="skill">Linux</div>
    <div class="skill">Networking</div>
    <div class="skill">MikroTik</div>
    <div class="skill">AWS</div>
    <div class="skill">Git & GitHub</div>
    <div class="skill">Docker</div>
    <div class="skill">Terraform</div>
    <div class="skill">Kubernetes</div>
</section>

<footer id="contact">
    <p>© 2026 Rufaid Mahmud | AWS CI/CD Demo</p>
</footer>

</body>
</html>
